<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JesterLoot</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#100d1c;color:white;font-family:Arial,sans-serif;padding:22px}
header{display:flex;justify-content:space-between;align-items:center}
.logo{font-size:25px;font-weight:900;color:#bd8aff}
.tag{background:#261b3c;padding:9px 13px;border-radius:20px;color:#d6b5ff}
h1{font-size:30px;margin-top:35px}
p{color:#aaa}
.balance{margin-top:22px;padding:24px;border-radius:22px;background:linear-gradient(130deg,#713bd1,#321b69)}
.balance small{color:#e3d5ff}
.money{font-size:34px;font-weight:bold;margin:12px 0}
button{border:0;border-radius:13px;padding:13px 17px;background:#b77cff;color:#170d25;font-weight:bold}
h2{margin-top:30px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.item{background:#201a30;padding:19px;border:1px solid #382a50;border-radius:17px}
.item b{display:block;margin:10px 0}
.item span{color:#aaa;font-size:13px}
footer{display:flex;justify-content:space-around;margin-top:30px;padding:17px;background:#211a30;border-radius:18px;color:#cdaaff}
</style>
</head>
<body>
<header><div class="logo">♛ JesterLoot</div><div class="tag">DEMO</div></header>
<h1>Привет, игрок! 👋</h1>
<p>Твой мир бонусов начинается здесь.</p>
<div class="balance">
<small>ТВОЙ ИГРОВОЙ БАЛАНС</small>
<div class="money" id="coins">1 250 JL</div>
<button onclick="openProfile()">Мой профиль →</button>
</div>
<h2>🎮 Игры и задания</h2>
<div class="grid">
<div class="item">🎯<b>Ежедневный бонус</b><span>Заходи каждый день</span><br><br><button onclick="bonus()">Получить +50</button></div>
<div class="item">🎲<b>Мини-игры</b><span>Играй и развлекайся</span><br><br><button onclick="alert('Скоро появится!')">Играть</button></div>
<div class="item">🏆<b>Турниры</b><span>Соревнования игроков</span><br><br><button onclick="alert('Скоро появится!')">Открыть</button></div>
<div class="item">👥<b>Пригласи друга</b><span>Бонусы за друзей</span><br><br><button onclick="alert('Реферальная система скоро появится!')">Пригласить</button></div>
</div>
<footer><span>🏠 Главная</span><span>🎮 Игры</span><span>👤 Профиль</span></footer>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script>
const API = "https://jesterloot-api.tbg7btsvmn.workers.dev";
let balance = 1250;
let telegramData = "";
let serverReady = false;

const coins = document.getElementById("coins");
const tg = window.Telegram?.WebApp;

if (tg && tg.initData) {
  tg.ready();
  tg.expand();

  telegramData = tg.initData;

  fetch(API + "/auth", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ initData: telegramData })
  })
  .then(response => response.json())
  .then(data => {
   if (!data.ok) {
  alert("Ошибка сервера: " + (data.error || "неизвестная ошибка") + " " + JSON.stringify(data.checks || {}));
  return;
}

    balance = data.user.balance;
    serverReady = true;
    coins.textContent = balance.toLocaleString("ru-RU") + " JL";
  })
 .catch((error) => {
  alert("Ошибка подключения: " + error.message);
});

} else {
  balance = Number(localStorage.getItem("jesterloot_balance")) || 1250;
  coins.textContent = balance.toLocaleString("ru-RU") + " JL";
}

async function bonus() {
  if (tg && tg.initData) {
    if (!serverReady) {
      alert("Подожди загрузки профиля.");
      return;
    }

    try {
      const response = await fetch(API + "/bonus", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ initData: telegramData })
      });

      const data = await response.json();

      if (!data.ok) {
        alert("Не удалось получить бонус.");
        return;
      }

      balance = data.user.balance;
      coins.textContent = balance.toLocaleString("ru-RU") + " JL";

      if (data.already_claimed) {
        alert("Ты уже получил сегодняшний бонус!");
      } else {
        alert("Получено 50 игровых JL!");
      }
    } catch (error) {
      alert("Ошибка соединения с сервером.");
    }

  } else {
    balance += 50;
    localStorage.setItem("jesterloot_balance", balance);
    coins.textContent = balance.toLocaleString("ru-RU") + " JL";
    alert("Получено 50 демонстрационных JL!");
  }
}
function openProfile() {
  const user = tg?.initDataUnsafe?.user || {};

  const profile = document.createElement("div");
  profile.id = "profileWindow";

  profile.style.cssText = `
    position: fixed;
    inset: 0;
    z-index: 9999;
    background: #100b1b;
    color: white;
    padding: 30px 20px;
    font-family: Arial;
    overflow-y: auto;
  `;

  profile.innerHTML = `
    <h1>👤 Мой профиль</h1>
    <div style="background:#29183e;padding:22px;border-radius:18px;margin-top:25px">
      <h2 id="profileName">Игрок</h2>
      <p id="profileUsername"></p>
      <p id="profileId"></p>
      <h2 id="profileBalance"></h2>
    </div>
    <button id="closeProfile" style="
      margin-top:25px;
      padding:15px 25px;
      border:0;
      border-radius:12px;
      background:#b36cff;
      font-size:16px;
    ">← Назад</button>
  `;

  document.body.appendChild(profile);

  profile.querySelector("#profileName").textContent =
    user.first_name || "Игрок";

  profile.querySelector("#profileUsername").textContent =
    user.username ? "@" + user.username : "Без имени пользователя";

  profile.querySelector("#profileId").textContent =
    user.id ? "ID: " + user.id : "ID недоступен";

  profile.querySelector("#profileBalance").textContent =
    "🪙 " + balance.toLocaleString("ru-RU") + " JL";

  profile.querySelector("#closeProfile").onclick = () => profile.remove();
}
</script>
</body>
</html>
